<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboards | Tomorrow Markets</title><link rel="icon" href="assets/logo.svg"><script>try{const t=localStorage.getItem('tomorrowMarkets.theme');if(t==='black'||t==='navy')document.documentElement.dataset.theme=t;}catch{}</script><link rel="stylesheet" href="assets/themes.css"><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/challenges.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@300;400;500&display=swap" rel="stylesheet"></head><body class="utility-page"><header class="utility-header topbar"><a class="wordmark" href="index.html">Tomorrow Markets</a><nav><a class="btn btn-ghost" href="index.html">Play</a><a class="btn btn-ghost" href="leaderboard.html">Leaderboards</a><a class="btn btn-ghost" href="live-portfolio.html">Daily portfolio</a><button type="button" class="btn btn-ghost" data-settings>Settings</button></nav></header><main class="utility-main"><h1>Leaderboards</h1><p class="utility-intro">Separate results for each challenge, strategy, data source and session configuration. <a href="leaderboard-legacy.html">View original boards</a>.</p><form id="board-filters" class="utility-filters"><label>Challenge<select id="challenge" class="field"><option value="trading">Trading</option><option value="portfolio">Portfolio challenge</option><option value="backtest">Historical backtest</option><option value="arena">RL arena</option></select></label><label>Strategy<select id="strategy" class="field"><option value="discretionary">Discretionary</option><option value="algorithmic">Python / R</option><option value="simple">Simple rules</option><option value="rl">RL bot</option></select></label><label>Data<select id="source" class="field"><option value="simulated">Simulated</option><option value="historical">Historical</option></select></label><label>Trading sessions<select id="sessionDays" class="field"><option value="5">5 days</option><option value="1">1 day</option></select></label><label>Trading bars<select id="barMinutes" class="field"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="0.25">Legacy 15 seconds</option></select></label><label>Real duration<select id="durationMinutes" class="field"><option value="20">20 minutes</option><option value="15">15 minutes</option><option value="10">10 minutes</option></select></label><label>Players<select id="playMode" class="field"><option value="single">Single player</option><option value="multi">Multiplayer</option></select></label><label>Portfolio rounds<select id="roundDays" class="field"><option value="5">5 trading days</option><option value="1">Daily</option></select></label><label>Dataset ID<input id="datasetId" class="field" value="simulation-v2" placeholder="Dataset ID"></label><button class="btn btn-primary" type="submit">Show board</button></form><div class="utility-tools"><label>Results<select id="board-scope" class="field"><option value="shared">Shared community board</option><option value="device">This device</option></select></label><a class="btn btn-ghost" href="live-portfolio.html">Daily portfolio standings</a></div><p id="board-status" role="status" class="utility-intro"></p><div class="utility-table-wrap"><table class="utility-table"><thead><tr><th>Rank</th><th>Handle</th><th>Return</th><th>PnL</th><th>Max drawdown</th><th>Historical window</th><th>Achieved</th></tr></thead><tbody id="board-rows"></tbody></table></div></main><script type="module" src="src/ui/BoardsUI.js"></script></body></html>
