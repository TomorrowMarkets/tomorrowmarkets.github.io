<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tomorrow Markets</title>
  
  <!-- Tailwind CSS & PeerJS WebRTC -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  
  <!-- Fonts & Tailwind Config -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              bg: '#080c14',
              panel: '#0f172a',
              border: '#1e293b',
              green: '#10b981',
              red: '#ef4444',
              blue: '#3b82f6',
              yellow: '#f59e0b',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #080c14; color: #f8fafc; font-family: 'Inter', sans-serif; user-select: none; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- LOBBY & START SCREEN -->
  <div id="lobby-screen" class="flex-1 flex flex-col items-center justify-center p-4 relative overflow-y-auto">
    <!-- Lobby HTML markup remains here -->
  </div>

  <!-- TRADING DASHBOARD -->
  <div id="trading-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
    <!-- Trading UI Layout markup remains here -->
  </div>

  <!-- ES Module Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
